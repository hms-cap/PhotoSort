name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject Google OAuth Client ID
        if: ${{ vars.GOOGLE_CLIENT_ID != '' }}
        env:
          CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          printf "export const CONFIG = {\n  GOOGLE_CLIENT_ID: '%s',\n};\n" "$CLIENT_ID" > js/config.js

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html sort.html edit.html styles.css editor.css js .nojekyll _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
